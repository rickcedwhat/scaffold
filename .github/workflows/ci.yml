name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run ESLint & Guardrails
        run: npm run lint

      - name: Component Test Coverage Check
        run: npm --workspace=@scaffold/ui run test:coverage-check

      - name: Run Unit Tests
        run: npm run test

      - name: Run Build
        run: npm run build

      - name: Generate CI Summary
        if: always()
        run: |
          echo "## 🛡️ CI Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **TypeScript Typecheck** | \`${{ job.status }}\` | All workspace packages typechecked cleanly |" >> $GITHUB_STEP_SUMMARY
          echo "| **ESLint & Component Guardrails** | \`${{ job.status }}\` | Strict encapsulation & \`@scaffold/ui\` rules enforced |" >> $GITHUB_STEP_SUMMARY
          echo "| **Component Coverage Guard** | \`${{ job.status }}\` | Every exported \`@scaffold/ui\` component has a test file |" >> $GITHUB_STEP_SUMMARY
          echo "| **Vitest Unit Tests** | \`${{ job.status }}\` | Unit tests across UI & tooling suites |" >> $GITHUB_STEP_SUMMARY
          echo "| **Production Build** | \`${{ job.status }}\` | Vite & TypeScript builds succeeded |" >> $GITHUB_STEP_SUMMARY

  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Smoke Suite
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
