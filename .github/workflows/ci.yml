name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run ESLint & Guardrails
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Run Build
        run: npm run build

      - name: Generate CI Summary
        if: always()
        run: |
          echo "## 🛡️ CI Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **TypeScript Typecheck** | \`${{ job.status }}\` | All workspace packages typechecked cleanly |" >> $GITHUB_STEP_SUMMARY
          echo "| **ESLint & Component Guardrails** | \`${{ job.status }}\` | Strict encapsulation & \`@scaffold/ui\` rules enforced |" >> $GITHUB_STEP_SUMMARY
          echo "| **Vitest Unit Tests** | \`${{ job.status }}\` | 60 unit tests across UI & tooling suites |" >> $GITHUB_STEP_SUMMARY
          echo "| **Production Build** | \`${{ job.status }}\` | Vite & TypeScript builds succeeded |" >> $GITHUB_STEP_SUMMARY
